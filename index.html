<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>자취생 냉장고 수명 알리미</title>
    <meta name="description" content="자취생을 위한 식재료 유통기한 D-Day 계산 및 알리미입니다.">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css');
        body { font-family: 'Pretendard', sans-serif; background-color: #f3f4f6; color: #1f2937; }
        .glass-card { background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(10px); border-radius: 1rem; box-shadow: 0 10px 25px rgba(0,0,0,0.05); border: 1px solid rgba(255,255,255,0.2); }
        .receipt { background: #fff; border: 1px dashed #d1d5db; border-radius: 0.5rem; padding: 1.5rem; position: relative; box-shadow: 0 4px 6px rgba(0,0,0,0.02); }
        .receipt::before, .receipt::after { content: ''; position: absolute; top: -10px; width: 20px; height: 20px; background: #f3f4f6; border-radius: 50%; }
        .receipt::before { left: -10px; } .receipt::after { right: -10px; }
        .btn-primary { background: linear-gradient(135deg, #3b82f6, #2563eb); color: white; transition: all 0.2s; }
        .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 4px 12px rgba(37,99,235,0.3); }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center py-10 px-4">
    <!-- Header -->
    <div class="w-full max-w-2xl text-center mb-8">
        <h1 class="text-3xl font-extrabold text-gray-900 mb-3 tracking-tight">자취생 냉장고 수명 알리미</h1>
        <p class="text-gray-500 font-medium">자취생을 위한 식재료 유통기한 D-Day 계산 및 알리미입니다.</p>
    </div>

    <!-- Top AdSense -->
    <div class="w-full max-w-2xl mb-8 bg-white rounded-lg overflow-hidden shadow-sm flex items-center justify-center min-h-[100px]">
        <ins class="adsbygoogle" style="display:block" data-ad-client="ca-pub-2228289204702106" data-ad-slot="auto" data-ad-format="auto" data-full-width-responsive="true"></ins>
        <script>(adsbygoogle = window.adsbygoogle || []).push({});</script>
    </div>

    <!-- Main Logic Container -->
    <div class="w-full max-w-2xl glass-card p-6 md:p-8 mb-8">
        <h2 class="text-3xl font-bold text-gray-800 mb-6 text-center">자취생 냉장고 수명 알리미</h2>
<p class="text-gray-600 mb-8 text-center">식재료 유통기한을 계산하고 D-Day를 확인하세요.</p>

<form id="foodItemForm" class="space-y-5">
    <div>
        <label for="foodName" class="block text-sm font-medium text-gray-700 mb-2">식재료 이름</label>
        <input type="text" id="foodName" placeholder="예: 우유, 계란, 사과" required
               class="w-full px-4 py-3 rounded-lg border-2 border-gray-300 focus:outline-none focus:ring-2 focus:ring-blue-500 transition duration-200 text-gray-800 bg-white shadow-sm">
    </div>
    <div>
        <label for="purchaseDate" class="block text-sm font-medium text-gray-700 mb-2">구매일</label>
        <input type="date" id="purchaseDate" required
               class="w-full px-4 py-3 rounded-lg border-2 border-gray-300 focus:outline-none focus:ring-2 focus:ring-blue-500 transition duration-200 text-gray-800 bg-white shadow-sm">
    </div>
    <div>
        <label for="expirationPeriod" class="block text-sm font-medium text-gray-700 mb-2">유통기한 (구매일로부터 경과 일수)</label>
        <input type="number" id="expirationPeriod" placeholder="예: 7 (7일)" required min="1"
               class="w-full px-4 py-3 rounded-lg border-2 border-gray-300 focus:outline-none focus:ring-2 focus:ring-blue-500 transition duration-200 text-gray-800 bg-white shadow-sm">
    </div>
    <button type="submit"
            class="w-full bg-blue-600 text-white font-bold py-3 rounded-lg hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:ring-offset-2 transition duration-200 shadow-md">
        D-Day 계산 및 추가하기
    </button>
</form>

<div class="receipt mt-8 bg-gradient-to-br from-gray-50 to-gray-100 p-6 rounded-lg shadow-lg">
    <h3 class="text-2xl font-bold text-gray-800 mb-5 text-center border-b-2 border-dashed border-gray-300 pb-3">나의 식료품 D-Day 리스트</h3>
    <div id="receipt-items" class="space-y-4">
        <!-- 동적으로 추가되는 식료품 목록 -->
        <p id="no-items-message" class="text-center text-gray-500 py-4">아직 추가된 식료품이 없습니다.</p>
    </div>
    <div id="receipt-footer" class="text-center mt-6 pt-4 border-t-2 border-dashed border-gray-300 text-sm text-gray-500">
        <p>현명한 소비, 즐거운 자취생활!</p>
    </div>
</div>

<script>
    document.addEventListener('DOMContentLoaded', () => {
        const form = document.getElementById('foodItemForm');
        const receiptItemsContainer = document.getElementById('receipt-items');
        const noItemsMessage = document.getElementById('no-items-message');

        // 로컬 스토리지에서 아이템 로드
        let foodItems = JSON.parse(localStorage.getItem('foodItems')) || [];

        // 아이템 렌더링 함수
        function renderFoodItems() {
            receiptItemsContainer.innerHTML = ''; // 기존 아이템 비우기

            if (foodItems.length === 0) {
                noItemsMessage.style.display = 'block';
                return;
            } else {
                noItemsMessage.style.display = 'none';
            }

            foodItems.sort((a, b) => new Date(a.expirationDate) - new Date(b.expirationDate)); // 만료일이 빠른 순으로 정렬

            foodItems.forEach((item, index) => {
                const today = new Date();
                today.setHours(0, 0, 0, 0); // 시간 정보를 제거하여 일 단위로만 비교

                const expirationDate = new Date(item.expirationDate);
                expirationDate.setHours(0, 0, 0, 0);

                const diffTime = expirationDate.getTime() - today.getTime();
                const diffDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24)); // 올림 처리하여 당일 포함

                let dDayText = '';
                let dDayClass = 'bg-gray-200 text-gray-700';

                if (diffDays === 0) {
                    dDayText = '오늘까지!';
                    dDayClass = 'bg-red-100 text-red-800 font-bold animate-pulse';
                } else if (diffDays > 0 && diffDays <= 3) {
                    dDayText = `D-${diffDays}`;
                    dDayClass = 'bg-red-100 text-red-800 font-bold';
                } else if (diffDays > 3 && diffDays <= 7) {
                    dDayText = `D-${diffDays}`;
                    dDayClass = 'bg-yellow-100 text-yellow-800 font-semibold';
                } else if (diffDays > 7) {
                    dDayText = `D-${diffDays}`;
                    dDayClass = 'bg-green-100 text-green-800';
                } else { // diffDays < 0
                    dDayText = `만료 ${Math.abs(diffDays)}일 지남`;
                    dDayClass = 'bg-gray-300 text-gray-600 line-through';
                }

                const itemDiv = document.createElement('div');
                itemDiv.className = `receipt-item flex justify-between items-center py-3 px-4 rounded-lg bg-white shadow-sm hover:shadow-md transition duration-200 ${index < foodItems.length - 1 ? 'border-b border-gray-200' : ''}`;
                itemDiv.innerHTML = `
                    <div class="flex-grow">
                        <p class="text-lg font-medium text-gray-800">${item.foodName}</p>
                        <p class="text-sm text-gray-500">구매일: ${item.purchaseDate} | 만료일: ${item.expirationDate}</p>
                    </div>
                    <span class="px-3 py-1 rounded-full text-sm font-semibold ml-4 ${dDayClass}">
                        ${dDayText}
                    </span>
                    <button data-index="${index}" class="ml-3 text-red-500 hover:text-red-700 transition duration-200 text-xl leading-none">
                        &times;
                    </button>
                `;
                receiptItemsContainer.appendChild(itemDiv);
            });
        }

        // 초기 렌더링
        renderFoodItems();

        form.addEventListener('submit', (event) => {
            event.preventDefault();

            const foodName = document.getElementById('foodName').value.trim();
            const purchaseDateStr = document.getElementById('purchaseDate').value;
            const expirationPeriod = parseInt(document.getElementById('expirationPeriod').value, 10);

            if (!foodName || !purchaseDateStr || isNaN(expirationPeriod) || expirationPeriod <= 0) {
                alert('모든 필드를 올바르게 입력해주세요.');
                return;
            }

            const purchaseDate = new Date(purchaseDateStr);
            purchaseDate.setDate(purchaseDate.getDate()); // UTC-local offset 보정

            const expirationDate = new Date(purchaseDate);
            expirationDate.setDate(purchaseDate.getDate() + expirationPeriod);

            const newFoodItem = {
                foodName: foodName,
                purchaseDate: purchaseDateStr,
                expirationDate: expirationDate.toISOString().split('T')[0] // YYYY-MM-DD 형식으로 저장
            };

            foodItems.push(newFoodItem);
            localStorage.setItem('foodItems', JSON.stringify(foodItems));

            renderFoodItems();
            form.reset(); // 폼 초기화
            document.getElementById('foodName').focus(); // 다시 입력할 수 있도록 포커스
        });

        receiptItemsContainer.addEventListener('click', (event) => {
            if (event.target.tagName === 'BUTTON') {
                const indexToRemove = parseInt(event.target.dataset.index, 10);
                if (!isNaN(indexToRemove)) {
                    foodItems.splice(indexToRemove, 1);
                    localStorage.setItem('foodItems', JSON.stringify(foodItems));
                    renderFoodItems();
                }
            }
        });
    });
</script>
    </div>

    <!-- Share & Ads -->
    <div class="w-full max-w-2xl flex flex-col gap-4 mb-10">
        <button onclick="shareApp()" class="w-full bg-[#fee500] text-[#191919] font-bold py-4 rounded-xl flex items-center justify-center gap-2 hover:bg-[#f4dc00] transition shadow-sm">
            <i class="fas fa-share-nodes"></i> 카카오톡 및 SNS 공유하기
        </button>
        <a href="#" class="w-full bg-[#ff3131] text-white font-bold py-4 rounded-xl flex items-center justify-center gap-2 hover:bg-[#e62c2c] transition shadow-sm">
            <i class="fas fa-shopping-bag"></i> 쿠팡 특별 기획전 바로가기
        </a>
    </div>

    <!-- Bottom AdSense -->
    <div class="w-full max-w-2xl bg-white rounded-lg overflow-hidden shadow-sm flex items-center justify-center min-h-[100px]">
        <ins class="adsbygoogle" style="display:block" data-ad-client="ca-pub-2228289204702106" data-ad-slot="auto" data-ad-format="auto" data-full-width-responsive="true"></ins>
        <script>(adsbygoogle = window.adsbygoogle || []).push({});</script>
    </div>

    <script>
        function shareApp() {
            if (navigator.share) {
                navigator.share({ title: '자취생 냉장고 수명 알리미', text: '자취생을 위한 식재료 유통기한 D-Day 계산 및 알리미입니다.', url: window.location.href });
            } else {
                navigator.clipboard.writeText(window.location.href);
                alert("링크가 복사되었습니다!");
            }
        }
    </script>
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-2228289204702106" crossorigin="anonymous"></script>
</body>
</html>
